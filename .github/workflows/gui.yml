name: gui
on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: gui/package-lock.json }
      - run: cargo build -p health
      - working-directory: gui
        run: |
          npm ci
          npx tsc -p .
          npx playwright install --with-deps chromium
          npx playwright test

  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\ngui/src-tauri -> target" }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: gui/package-lock.json }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - shell: bash
        run: scripts/stage-core.sh release
      - name: shell smoke test (real serve, large replies, exit with parent)
        shell: bash
        run: cargo build -p health && cargo test --manifest-path gui/src-tauri/Cargo.toml
      - working-directory: gui
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: health-gui-${{ matrix.os }}
          path: |
            gui/src-tauri/target/release/bundle/**/*.dmg
            gui/src-tauri/target/release/bundle/**/*.app.tar.gz
            gui/src-tauri/target/release/bundle/**/*.msi
            gui/src-tauri/target/release/bundle/**/*.exe
            gui/src-tauri/target/release/bundle/**/*.deb
            gui/src-tauri/target/release/bundle/**/*.rpm
            gui/src-tauri/target/release/bundle/**/*.AppImage
