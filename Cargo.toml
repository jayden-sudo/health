[workspace]
resolver = "3"
members = ["crates/health-core", "crates/health-api", "crates/health-ocr", "crates/health-connect", "crates/health-proto", "crates/health"]
exclude = ["gui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.89"

[workspace.dependencies]
health-core = { path = "crates/health-core" }
health-api = { path = "crates/health-api" }
health-ocr = { path = "crates/health-ocr" }
health-connect = { path = "crates/health-connect" }
health-proto = { path = "crates/health-proto" }

# Dependencies optimised in dev builds too: tract runs the OCR models ~20× faster, and our crates stay debuggable.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.health-ocr]
opt-level = 3
